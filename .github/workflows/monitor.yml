name: Macau Weather Real-time Alert Monitor

on:
  schedule:
    # 每 5 小時重新喚醒一個 4.5 小時的輪詢任務
    - cron: '0 */5 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Macau

concurrency:
  group: weather-realtime-monitor
  cancel-in-progress: true

jobs:
  poll-and-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 檢出倉庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴庫
        run: |
          pip install -r requirements.txt

      - name: 執行高頻輪詢 (每 60 秒檢測一次 XML 更新)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          END_TIME=$(($(date +%s) + 16200))
          INTERVAL=60

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          while [ $(date +%s) -lt $END_TIME ]; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] 檢查 SMG XML 更新..."
            python app.py

            # 若 state.json 有變更 (代表已發布過新時間點的警報)，自動提交保存狀態
            if [ -n "$(git status --porcelain state.json)" ]; then
              git add state.json
              git commit -m "chore: update alert state [skip ci]" || true
              git push origin main || echo "Push skipped or retry on next run."
            fi

            sleep $INTERVAL
          done
